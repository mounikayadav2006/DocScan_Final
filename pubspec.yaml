name: docscan
description: "DocScan - Smart Document Scanner & Text Extractor (Flutter Lab Project)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Exp 5b - state management
  provider: ^6.1.2
  # Exp 9a/9b - REST API
  http: ^1.2.2
  # Camera / gallery
  image_picker: ^1.1.2
  # On-device OCR (Google ML Kit)
  google_mlkit_text_recognition: ^0.15.0
  # Local database
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  # PDF export + share
  pdf: ^3.11.1
  share_plus: ^10.1.4
  intl: '>=0.19.0 <1.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
